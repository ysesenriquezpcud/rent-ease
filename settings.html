<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – RentEase</title>
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>
  <header class="header" id="mainHeader">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="RentEase" class="logo-img" />
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Browse</a>
        <a href="saved.html" class="nav-link">Saved</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="settings.html" class="nav-link active">Settings</a>
      </nav>
      <div class="header-actions">
      <div class="header-search" id="headerSearchWrap">
          <input type="text" id="headerSearchInput" placeholder="Search..." aria-label="Search" autocomplete="off" />
          <button class="icon-btn" type="button" aria-label="Search">
            <img src="images/search.png" alt="" class="icon-img icon-theme-dark" />
            <img src="images/search-light.png" alt="" class="icon-img icon-theme-light" />
          </button>
          <div class="header-search-dropdown" id="headerSearchDropdown"></div>
        </div>
        <a href="messages.html" class="icon-btn" aria-label="Messages">
          <img src="images/chat.png" alt="" class="icon-img icon-lg icon-theme-dark" />
          <img src="images/chat-light.png" alt="" class="icon-img icon-lg icon-theme-light" />
        </a>
        <a href="profile.html" class="icon-btn" aria-label="Profile">
          <img src="images/profile.png" alt="" class="icon-img icon-lg icon-theme-dark" />
          <img src="images/profile-light.png" alt="" class="icon-img icon-lg icon-theme-light" />
        </a>
        <button class="btn-landlord">Log in as landlord</button>
      </div>
    </div>
  </header>

  <div class="page-inner settings-inner">
    <div class="listings-header">
      <h2>Settings</h2>
      <p class="listings-count">Manage your preferences</p>
    </div>

    <div class="settings-card">
      <div class="settings-row">
        <div class="settings-info">
          <h3>Appearance</h3>
          <p>Switch between light and dark mode</p>
        </div>
        <div class="theme-toggle-wrap">
          <span class="theme-label">Light</span>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" role="switch" aria-checked="false">
            <span class="theme-toggle-knob"></span>
          </button>
          <span class="theme-label">Dark</span>
        </div>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-row">
        <div class="settings-info">
          <h3>Saved properties</h3>
          <p>Clear all bookmarked listings</p>
        </div>
        <button class="settings-btn danger" id="clearSavedBtn">Clear all</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
  <script src="js/header-search.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
