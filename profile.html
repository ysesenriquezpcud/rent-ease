<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – RentEase</title>
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <header class="header" id="mainHeader">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="RentEase" class="logo-img" />
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Browse</a>
        <a href="saved.html" class="nav-link">Saved</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="settings.html" class="nav-link">Settings</a>
      </nav>
      <div class="header-actions">
        <div class="header-search" id="headerSearchWrap">
          <input type="text" id="headerSearchInput" placeholder="Search..." aria-label="Search" autocomplete="off" />
          <button class="icon-btn" type="button" aria-label="Search">
            <img src="images/search.png" alt="" class="icon-img icon-theme-dark" />
            <img src="images/search-light.png" alt="" class="icon-img icon-theme-light" />
          </button>
          <div class="header-search-dropdown" id="headerSearchDropdown"></div>
        </div>
        <a href="messages.html" class="icon-btn" aria-label="Messages">
          <img src="images/chat.png" alt="" class="icon-img icon-lg icon-theme-dark" />
          <img src="images/chat-light.png" alt="" class="icon-img icon-lg icon-theme-light" />
        </a>
        <a href="profile.html" class="icon-btn" aria-label="Profile">
          <img src="images/profile.png" alt="" class="icon-img icon-lg icon-theme-dark" />
          <img src="images/profile-light.png" alt="" class="icon-img icon-lg icon-theme-light" />
        </a>
        <button type="button" class="btn-landlord">Log in as landlord</button>
      </div>
    </div>
  </header>

  <main class="page-inner">
    <div id="profileRoot"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!getCurrentUser()) {
      window.location.href = "login.html";
    } else {
      syncUserFromStorage();
    }
  </script>
  <script src="js/header-search.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
