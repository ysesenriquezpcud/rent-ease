<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In – RentEase</title>
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="login.html" class="auth-logo">
        <img src="images/logo.png" alt="RentEase" />
      </a>
      <h1 class="auth-title">User Log In</h1>

      <form id="loginForm">
        <div class="auth-field">
          <label class="auth-label" for="email">Email</label>
          <input class="auth-input" type="email" id="email" placeholder="Enter your email" required />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="password">Password</label>
          <div class="password-wrap">
            <input class="auth-input" type="password" id="password" placeholder="Enter your password" required />
            <button type="button" class="password-toggle" id="toggleLoginPass" aria-label="Show password">
              <img src="images/show_password.png" alt="" id="loginPassIcon" />
            </button>
          </div>
        </div>
        <p class="auth-error" id="loginError"></p>

        <div class="auth-actions between">
          <a href="#" class="auth-link">Forgot password?</a>
          <button type="submit" class="btn-auth btn-auth-primary">Log In</button>
        </div>
      </form>

      <div class="auth-divider">Doesn't have an account yet</div>

      <div class="auth-actions center">
        <a href="register.html" class="btn-auth btn-auth-secondary">Create User Account</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (getCurrentUser()) window.location.href = "index.html";

    document.getElementById("toggleLoginPass").addEventListener("click", () => {
      const input = document.getElementById("password");
      const icon = document.getElementById("loginPassIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.src = "images/hide_password.png";
      } else {
        input.type = "password";
        icon.src = "images/show_password.png";
      }
    });

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const err = document.getElementById("loginError");

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        setCurrentUser({
          email,
          name: "Admin",
          role: "admin",
          status: "verified",
          verified: true
        });
        window.location.href = "index.html";
        return;
      }

      const users = JSON.parse(localStorage.getItem("rentease_users") || "[]");
      const found = users.find(
        (u) =>
          u.email.toLowerCase() === email.toLowerCase() &&
          u.password === password
      );

      if (found) {
        setCurrentUser({
          email: found.email,
          name: found.firstName + " " + found.surname,
          role: "user",
          status: found.status || (found.verified ? "verified" : "unverified"),
          verified: !!found.verified
        });
        window.location.href = "index.html";
        return;
      }

      err.textContent = "Invalid email or password.";
      err.classList.add("show");
    });
  </script>
</body>
</html>
